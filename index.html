<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B Khan Radio - Hausa News Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
    }

    .audio-player {
      margin-top: 20px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>B Khan Radio</h1>
    <p>Barka da zuwa babbar dandalin labarai da rediyo na Hausa.</p>
    
    <!-- Sashen Rediyo / Audio Player -->
    <div class="audio-player">
      <h3>Saurari Live Radio:</h3>
      <audio controls>
        <source src="LINK_DIN_RADIO_ENKA.mp3" type="audio/mpeg">
        Makarambata (browser) ɗinka ba ta goyon bayan sauraron audio.
      </audio>
    </div>
  </div>

</body>
</html>
